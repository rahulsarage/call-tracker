<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Tracker</title>
    <link rel="icon" type="image/svg+xml" href="https://cdn.brandfetch.io/idhM5WMkv7/theme/dark/symbol.svg?c=1dxbfHSJFAPEGdCLU4o5B">
    <!-- SheetJS Styled Library for Excel Export with Formatting -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 900px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .tally-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .tally-row:last-child { border: 0; margin: 0; padding: 0; }
        .label-group { display: flex; flex-direction: column; }
        .label { font-weight: 600; }
        .sub-label { font-size: 0.85rem; color: #64748b; }
        .controls { display: flex; align-items: center; gap: 10px; }
        
        input[type="number"], input[type="text"], input[type="tel"], select {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            background-color: white;
        }
        input[type="number"].tally-input {
            width: 70px;
            text-align: center;
        }
        input[type="text"], input[type="number"].full-width, input[type="tel"].full-width, select.full-width {
            width: 100%;
            box-sizing: border-box;
        }
        button.btn-counter {
            background: var(--primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            font-size: 1.25rem;
            cursor: pointer;
        }
        button.btn-counter:active { transform: scale(0.95); }
        .ratio-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f1f5f9;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
        }
        .meet { background: var(--success); }
        .miss { background: var(--danger); }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .settings-group { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        .btn-action {
            flex: 1;
            padding: 12px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: #fff;}
        .btn-danger { background: var(--danger); }
        
        /* Black space style */
        .black-space {
            background-color: #000000;
            color: #00ff00;
            font-family: monospace;
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #334155;
            box-sizing: border-box;
            resize: vertical;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .black-space::placeholder { color: #475569; }
        
        /* Active Timer Styles */
        #active-timers-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            padding-right: 5px;
        }
        .timer-card {
            background: #f1f5f9;
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timer-info strong { display: block; font-size: 1.05rem; }
        .timer-info small { color: #64748b; font-size: 0.85rem; }
        .timer-clock { font-size: 1.4rem; font-weight: bold; font-variant-numeric: tabular-nums; margin-right: 15px; }
        .btn-remove { background: var(--danger); color: white; border: none; border-radius: 4px; padding: 6px 10px; cursor: pointer; }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon { font-size: 3rem; margin-bottom: 10px; }
        .modal-details { text-align: left; background: #f8fafc; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .modal-details p { margin: 5px 0; font-size: 0.95rem; }
    </style>
</head>
<body>
    <!-- MP3 source for standard compatibility -->
    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Notification Modal -->
    <div id="alarm-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">🔔</div>
            <h2 style="margin-top: 0; color: var(--danger);">Callback Due!</h2>
            <div class="modal-details">
                <p><strong>Number:</strong> <span id="modal-number"></span></p>
                <p><strong>Reason:</strong> <span id="modal-reason"></span></p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-action btn-warning" onclick="snoozeTimer()">Snooze (5 Mins)</button>
                <button class="btn-action btn-danger" onclick="dismissTimer()">Dismiss</button>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Call Tracker</h1>
        <div class="grid">
            <!-- Left Column -->
            <div class="column">
                <!-- Manual Durations Paste Area -->
                <div class="card" style="margin-bottom: 20px;">
                    <h2>Call Durations</h2>
                    <p class="sub-label" style="margin-top: 0; margin-bottom: 10px;">Paste the duration of your calls (MM:SS or HH:MM:SS) to calculate AHT automatically.</p>
                    <textarea 
                        id="manual-timestamps" 
                        class="black-space" 
                        placeholder="Paste call durations here...&#10;&#10;Format Examples:&#10;05:30&#10;12:45&#10;01:05:10" 
                        oninput="parseDurationsAndCalculate()"
                    ></textarea>
                    
                    <div class="ratio-row" style="margin-top: 15px; margin-bottom: 0;">
                        <span class="label"><b>AHT</b></span>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <strong id="logged-aht">0 seconds</strong>
                        </div>
                    </div>
                </div>

                <!-- Tallies -->
                <div class="card">
                    <h2>Counters</h2>
                    <div id="counters-container"></div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="column">
                <!-- Callback Timers -->
                <div class="card" style="margin-bottom: 20px;">
                    <h2>Callback Timers</h2>
                    <div class="settings-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 10px;">
                        <div class="settings-group">
                            <label class="label">Callback Number</label>
                            <input type="tel" id="cb-number" class="full-width" placeholder="000-000-0000">
                        </div>
                        <div class="settings-group">
                            <label class="label">Duration (HH:MM)</label>
                            <div style="display: flex; gap: 5px;">
                                <select id="cb-hours" class="full-width" style="text-align: center;" title="Hours">
                                    <!-- Options populated by JS -->
                                </select>
                                <span style="display: flex; align-items: center; font-weight: bold;">:</span>
                                <select id="cb-minutes" class="full-width" style="text-align: center;" title="Minutes">
                                    <!-- Options populated by JS -->
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="settings-group" style="margin-bottom: 15px;">
                        <label class="label">Reason for Call</label>
                        <input type="text" id="cb-reason" class="full-width" placeholder="Check if issue is resolved or follow up">
                    </div>
                    
                    <button class="btn-action btn-success" onclick="addTimer()">+ Add Timer</button>

                    <!-- Container for active timers -->
                    <div id="active-timers-list"></div>
                </div>

                <!-- Ratios & Thresholds -->
                <div class="card">
                    <h2>Ratios & Goals</h2>
                    <div class="settings-grid">
                        <div class="settings-group">
                            <label class="sub-label">Max AHT (Secs)</label>
                            <input type="number" class="full-width" id="target-aht" value="951" step="1" oninput="calculateMetrics()">
                        </div>
                        <div class="settings-group">
                            <label class="sub-label">Target Call Coding %</label>
                            <input type="number" class="full-width" id="target-coding" value="80" step="1" oninput="calculateMetrics()">
                        </div>
                        <div class="settings-group">
                            <label class="sub-label">Max SV (Count)</label>
                            <input type="number" class="full-width" id="target-sv" value="3" oninput="calculateMetrics()">
                        </div>
                    </div>
                    <div id="ratios-container"></div>
                    <button class="btn-action" style="margin-top: 15px;" onclick="exportExcel()">Export Daily Records (Excel)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === METRICS LOGIC ===
        const metrics = {
            calls: { label: 'Total Calls', sub: 'All answered lines', val: 0 },
            tickets: { label: 'Tickets Created', sub: 'Logged issues', val: 0 },
            sv: { label: 'SV Booked', sub: 'Service visits scheduled', val: 0 },
            pitched: { label: 'Sales Pitched', sub: 'Offers made', val: 0 },
            good: { label: 'Good Calls', sub: 'Resolved issues with quality met', val: 0 },
            transfers: { label: 'Transfers', sub: 'Moved calls', val: 0 }
        };

        let totalCallTimeSecs = 0;

        function init() {
            const container = document.getElementById('counters-container');
            container.innerHTML = '';
            Object.keys(metrics).forEach(key => {
                container.innerHTML += `
                    <div class="tally-row">
                        <div class="label-group">
                            <span class="label">${metrics[key].label}</span>
                            <span class="sub-label">${metrics[key].sub}</span>
                        </div>
                        <div class="controls">
                            <input type="number" class="tally-input" id="input-${key}" value="${metrics[key].val}" onchange="updateVal('${key}', this.value)">
                            <button class="btn-counter" onclick="increment('${key}')">+</button>
                        </div>
                    </div>
                `;
            });
            calculateMetrics();
            
            // Populate Dropdown Dials for Timers
            const hoursSelect = document.getElementById('cb-hours');
            for(let i = 0; i <= 23; i++) {
                hoursSelect.innerHTML += `<option value="${i}">${i.toString().padStart(2, '0')} H</option>`;
            }
            hoursSelect.value = "0"; // Default 0 hours

            const minutesSelect = document.getElementById('cb-minutes');
            for(let i = 0; i <= 59; i++) {
                minutesSelect.innerHTML += `<option value="${i}">${i.toString().padStart(2, '0')} M</option>`;
            }
            minutesSelect.value = "30"; // Default 30 minutes

            // Start master clock for timers
            setInterval(timerTick, 1000);
        }

        function increment(key) {
            metrics[key].val++;
            document.getElementById(`input-${key}`).value = metrics[key].val;
            calculateMetrics();
        }

        function updateVal(key, val) {
            metrics[key].val = Math.max(0, parseFloat(val) || 0);
            calculateMetrics();
        }

        function calculateMetrics() {
            const c = metrics.calls.val || 0;
            const t = totalCallTimeSecs || 0; 
            const tk = metrics.tickets.val || 0;
            const sv = metrics.sv.val || 0;
            const p = metrics.pitched.val || 0;
            const g = metrics.good.val || 0;
            const tr = metrics.transfers.val || 0;

            const targetAht = parseFloat(document.getElementById('target-aht').value) || 0;
            const targetCoding = parseFloat(document.getElementById('target-coding').value) || 0;
            const targetSv = parseFloat(document.getElementById('target-sv').value) || 0;

            const aht = c ? Math.round(t / c) : 0; 
            const pitchRate = c ? ((p / c) * 100).toFixed(1) : 0;
            const ticketRate = c ? ((tk / c) * 100).toFixed(1) : 0;
            const transferRate = c ? ((tr / c) * 100).toFixed(1) : 0;

            const ratiosContainer = document.getElementById('ratios-container');
            
            const ahtStatus = aht > 0 ? (aht <= targetAht ? 'meet' : 'miss') : '';
            const codingStatus = ticketRate > 0 ? (ticketRate >= targetCoding ? 'meet' : 'miss') : '';
            const svStatus = targetSv > 0 ? (sv <= targetSv ? 'meet' : 'miss') : '';

            ratiosContainer.innerHTML = `
                <div class="ratio-row">
                    <span class="label">Avg Handling Time (AHT)</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <strong>${aht} secs</strong>
                        ${ahtStatus ? `<span class="status-badge ${ahtStatus}">${ahtStatus.toUpperCase()}</span>` : ''}
                    </div>
                </div>
                <div class="ratio-row">
                    <span class="label">Call Coding</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <strong>${ticketRate}%</strong>
                        ${codingStatus ? `<span class="status-badge ${codingStatus}">${codingStatus.toUpperCase()}</span>` : ''}
                    </div>
                </div>
                <div class="ratio-row">
                    <span class="label">SV Booked</span>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <strong>${sv}</strong>
                        ${svStatus ? `<span class="status-badge ${svStatus}">${svStatus.toUpperCase()}</span>` : ''}
                    </div>
                </div>
                <div class="ratio-row"><span class="label">Good Calls</span><strong>${g}</strong></div>
                <div class="ratio-row"><span class="label">Pitch Rate</span><strong>${pitchRate}%</strong></div>
                <div class="ratio-row"><span class="label">Transfer Rate</span><strong>${transferRate}%</strong></div>
            `;
        }

        // === DURATION PARSER LOGIC ===
        function parseDurationsAndCalculate() {
            const text = document.getElementById('manual-timestamps').value;
            let totalSeconds = 0;
            let callCount = 0;
            
            const regex = /(?:(\d+):)?(\d{1,2}):(\d{2})/g;
            const matches = [...text.matchAll(regex)];

            matches.forEach(match => {
                const h = match[1] ? parseInt(match[1]) : 0;
                const m = parseInt(match[2]);
                const s = parseInt(match[3]);
                
                totalSeconds += (h * 3600) + (m * 60) + s;
                callCount++;
            });

            const ahtInSeconds = callCount > 0 ? Math.round(totalSeconds / callCount) : 0;
            document.getElementById('logged-aht').innerText = `${ahtInSeconds} seconds`;

            if (callCount > 0 || text === '') {
                metrics.calls.val = callCount;
                totalCallTimeSecs = totalSeconds;
                document.getElementById('input-calls').value = metrics.calls.val;
                calculateMetrics();
            }
        }

        // === CALLBACK TIMERS LIST LOGIC ===
        let timers = [];
        let timerCounterId = 0;
        let currentRingingTimerId = null;
        let audioUnlocked = false;

        function addTimer() {
            // UNLOCK AUDIO on first interaction to bypass browser autoplay blocks
            const audio = document.getElementById('alarm-sound');
            if (!audioUnlocked) {
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                    audioUnlocked = true;
                }).catch(err => console.log('Audio unlock failed:', err));
            }

            const numberInput = document.getElementById('cb-number');
            const reasonInput = document.getElementById('cb-reason');
            const hoursInput = document.getElementById('cb-hours');
            const minutesInput = document.getElementById('cb-minutes');

            const number = numberInput.value.trim() || 'Unknown Number';
            const reason = reasonInput.value.trim() || 'Callback due';
            
            const hrs = parseInt(hoursInput.value) || 0;
            const mins = parseInt(minutesInput.value) || 0;
            let totalSecs = (hrs * 3600) + (mins * 60);

            // Fallback safety if user accidentally adds 0h 0m
            if (totalSecs <= 0) {
                totalSecs = 15 * 60; // 15 mins default
            }

            const newTimer = {
                id: timerCounterId++,
                number: number,
                reason: reason,
                remainingSecs: totalSecs
            };

            timers.push(newTimer);
            renderTimers();

            // Clear inputs for next entry
            numberInput.value = '';
            reasonInput.value = '';
            hoursInput.value = '0';
            minutesInput.value = '15';
        }

        function removeTimer(id) {
            timers = timers.filter(t => t.id !== id);
            renderTimers();
        }

        function timerTick() {
            let needsRender = false;
            timers.forEach(t => {
                if (t.remainingSecs > 0) {
                    t.remainingSecs--;
                    needsRender = true;
                    // Trigger alarm when hitting exactly zero
                    if (t.remainingSecs === 0 && currentRingingTimerId === null) {
                        triggerAlarm(t);
                    }
                }
            });
            if (needsRender) renderTimers();
        }

        function renderTimers() {
            const listContainer = document.getElementById('active-timers-list');
            listContainer.innerHTML = '';

            timers.forEach(t => {
                if (t.remainingSecs <= 0 && t.id !== currentRingingTimerId) return;

                const h = Math.floor(t.remainingSecs / 3600);
                const m = Math.floor((t.remainingSecs % 3600) / 60).toString().padStart(2, '0');
                const s = (t.remainingSecs % 60).toString().padStart(2, '0');
                
                // Show HH if there is at least 1 hour, otherwise MM:SS
                const timeDisplay = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
                
                // Turn red if under 2 minutes
                const isUrgent = t.remainingSecs > 0 && t.remainingSecs <= 120;
                const clockColor = isUrgent ? 'var(--danger)' : 'var(--text)';

                listContainer.innerHTML += `
                    <div class="timer-card">
                        <div class="timer-info">
                            <strong>${t.number}</strong>
                            <small>${t.reason}</small>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <span class="timer-clock" style="color: ${clockColor};">${timeDisplay}</span>
                            <button class="btn-remove" onclick="removeTimer(${t.id})" title="Cancel Timer">✖</button>
                        </div>
                    </div>
                `;
            });
        }

        function triggerAlarm(timer) {
            currentRingingTimerId = timer.id;
            document.getElementById('modal-number').innerText = timer.number;
            document.getElementById('modal-reason').innerText = timer.reason;
            
            document.getElementById('alarm-modal').style.display = 'flex';
            const audio = document.getElementById('alarm-sound');
            audio.currentTime = 0;
            
            audio.play().catch(err => {
                console.log('Audio autoplay prevented by browser at runtime.', err);
            });
        }

        function snoozeTimer() {
            const timer = timers.find(t => t.id === currentRingingTimerId);
            if (timer) {
                timer.remainingSecs = 5 * 60; // Adds 5 minutes
            }
            closeModal();
            renderTimers();
        }

        function dismissTimer() {
            if (currentRingingTimerId !== null) {
                removeTimer(currentRingingTimerId);
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('alarm-modal').style.display = 'none';
            document.getElementById('alarm-sound').pause();
            currentRingingTimerId = null;
        }

        // === EXCEL FORMATTED EXPORT LOGIC ===
        function exportExcel() {
            if (typeof XLSX === 'undefined') {
                alert("Excel library is still loading or failed to load. Please check your internet connection.");
                return;
            }

            // Calculate AHT in seconds for the export
            const c = metrics.calls.val || 0;
            const t = totalCallTimeSecs || 0;
            const ahtSecs = c ? Math.round(t / c) : 0;

            // Define the specific header layout
            const headers = [
                "Total Calls", 
                "Transfers", 
                "SV Booked", 
                "Good Calls", 
                "Sales Pitched", 
                "Tickets Created",
                "AHT (Secs)"
            ];

            // Define the corresponding values based on your active metrics map
            const values = [
                metrics.calls.val,
                metrics.transfers.val,
                metrics.sv.val,
                metrics.good.val,
                metrics.pitched.val,
                metrics.tickets.val,
                ahtSecs
            ];

            // Combine into a 2D array representing rows and columns
            const exportData = [headers, values];
            const ws = XLSX.utils.aoa_to_sheet(exportData);

            // Styling parameters matching the uploaded image
            const headerStyle = {
                fill: { fgColor: { rgb: "17365D" } }, // Dark blue background
                font: { color: { rgb: "FFFFFF" }, bold: true }, // White bold text
                border: {
                    top: { style: "thin", color: { rgb: "000000" } },
                    bottom: { style: "thin", color: { rgb: "000000" } },
                    left: { style: "thin", color: { rgb: "000000" } },
                    right: { style: "thin", color: { rgb: "000000" } }
                },
                alignment: { horizontal: "center", vertical: "center" }
            };
            
            const valueStyle = {
                border: {
                    top: { style: "thin", color: { rgb: "000000" } },
                    bottom: { style: "thin", color: { rgb: "000000" } },
                    left: { style: "thin", color: { rgb: "000000" } },
                    right: { style: "thin", color: { rgb: "000000" } }
                },
                alignment: { horizontal: "center", vertical: "center" }
            };

            // Loop over the cells in the worksheet to inject the custom styles
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cell_address = { c: C, r: R };
                    const cell_ref = XLSX.utils.encode_cell(cell_address);
                    
                    if (!ws[cell_ref]) continue; // Skip empty cells
                    
                    if (R === 0) {
                        // Apply Header Styling
                        ws[cell_ref].s = headerStyle;
                    } else {
                        // Apply Data Value Styling
                        ws[cell_ref].s = valueStyle;
                    }
                }
            }

            // Define specific column widths so text doesn't clip
            ws['!cols'] = [
                { wch: 15 }, // Total Calls
                { wch: 15 }, // Transfers
                { wch: 15 }, // SV Booked
                { wch: 15 }, // Good Calls
                { wch: 18 }, // Sales Pitched
                { wch: 18 }, // Tickets Created
                { wch: 15 }  // AHT (Secs)
            ];

            // Build the workbook and append the styled sheet
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Daily Records");

            // Trigger the download with today's date
            const dateStr = new Date().toISOString().split('T')[0];
            const fileName = `call-tracker-${dateStr}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        init();
    </script>
</body>
